<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripMind AI</title>
<meta http-equiv="refresh" content="2; url=./tripmind-ai/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#FFF7ED;color:#0F172A;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
  .card{max-width:460px}
  .mark{width:62px;height:62px;border-radius:18px;margin:0 auto 22px;background:linear-gradient(135deg,#EA580C,#D97706);display:grid;place-items:center;box-shadow:0 14px 34px rgba(234,88,12,.32)}
  .mark svg{width:34px;height:34px;stroke:#fff}
  h1{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;letter-spacing:-.02em}
  h1 b{color:#EA580C}
  p{color:#475569;margin:12px 0 26px;line-height:1.6}
  a.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;border-radius:44px;background:#EA580C;color:#fff;font-weight:600;text-decoration:none;box-shadow:0 12px 30px rgba(234,88,12,.3)}
  .alt{display:block;margin-top:18px;font-size:.88rem;color:#94A3B8}
  .alt a{color:#0891B2;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.4"/></svg></div>
    <h1>Trip<b>Mind</b> AI</h1>
    <p>Taking you to the travel planner&hellip; If it doesn't load automatically, tap below.</p>
    <a class="btn" href="./tripmind-ai/">Open TripMind AI &rarr;</a>
    <span class="alt">Also here: <a href="./pizza-site/">Amora Pizza</a></span>
  </div>
</body>
</html>
