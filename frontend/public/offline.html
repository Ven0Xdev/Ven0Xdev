<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexora — Offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d0d0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 420px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 8px;
    background: rgba(250, 178, 25, 0.14); color: #fab219; font-weight: 600; font-size: 13px; margin-bottom: 16px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #fab219; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #898781; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #2a78d6; color: #fff; border: none; border-radius: 8px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>OFFLINE — NO CACHED DATA</div>
    <h1>Nexora needs a connection for this page</h1>
    <p>
      This page hasn't been loaded before, so there is no cached data to show. Once you've visited a
      page while online, Nexora can show you the last verified data offline, clearly labeled.
    </p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
