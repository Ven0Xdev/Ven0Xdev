name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/tripmind-ai-travel-planner-c5rmmm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          # Landing redirect at the root
          cp index.html _site/index.html
          # The apps (static, no build step)
          cp -r tripmind-ai _site/tripmind-ai
          if [ -d pizza-site ]; then cp -r pizza-site _site/pizza-site; fi
          # Disable Jekyll processing so files are served as-is
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
