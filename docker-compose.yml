services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ven0x
      POSTGRES_PASSWORD: ven0x
      POSTGRES_DB: ven0x_otc
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ven0x"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ven0x:ven0x@timescaledb:5432/ven0x_otc
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/model_artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional OTC/micro-cap continuous scanner — not part of the mainstream
  # platform (see backend/app/services/otc/__init__.py). Opt-in only:
  # `docker compose --profile otc up` (and set OTC_MODULE_ENABLED=true in
  # backend/.env, or this worker exits immediately on start).
  scanner:
    profiles: ["otc"]
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.scan_scheduler"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ven0x:ven0x@timescaledb:5432/ven0x_otc
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/model_artifacts
    healthcheck:
      # /health/ready (not /health): confirms the database schema is
      # actually at the expected Alembic head, not just that the process
      # is up — see docs/DATABASE.md §5. python's stdlib avoids adding curl
      # to the image just for this.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Mainstream prediction ledger + outcome evaluator (Phase 7) — runs by
  # default, not profile-gated like `scanner` above: logging the platform's
  # own real predictions and proving out their track record over the
  # 20-asset multi-asset universe is core product behavior, not an optional
  # module. See backend/app/workers/prediction_scheduler.py.
  prediction-logger:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.prediction_scheduler"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ven0x:ven0x@timescaledb:5432/ven0x_otc
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/model_artifacts

  # Continuous NCS (Nexora Conviction Signal) evaluator — runs by default,
  # not profile-gated like `scanner` above: without this, chart Buy/Sell
  # markers, the Shadow track record, and autonomous paper trading's own
  # trigger all stay dormant for any symbol nobody manually clicked
  # "Evaluate now" on. See backend/app/workers/ncs_scheduler.py.
  ncs-scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.ncs_scheduler"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ven0x:ven0x@timescaledb:5432/ven0x_otc
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/model_artifacts

  # Resting-order trigger sweep (limit/stop/take-profit/stop-loss) — runs
  # by default: without it, a limit/stop PaperOrder would sit pending
  # forever, and OCO brackets would never fire. See
  # backend/app/workers/order_scheduler.py.
  order-scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.order_scheduler"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ven0x:ven0x@timescaledb:5432/ven0x_otc
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/model_artifacts

  lowpri-backfill-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.lowpri_backfill_worker"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ven0x:ven0x@timescaledb:5432/ven0x_otc
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  timescale_data:
  model_artifacts:
