# Alembic configuration.
# NOTE: sqlalchemy.url is deliberately absent. The DSN is resolved from VYRAXIS
# settings inside migrations/env.py so that application and migrations can never
# disagree about which database they are talking to.
[alembic]
script_location = src/vyraxis/storage/migrations
prepend_sys_path = src
path_separator = os
timezone = UTC
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
