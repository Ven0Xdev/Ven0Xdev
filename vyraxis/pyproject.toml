[project]
name = "vyraxis"
version = "0.1.0"
description = "VYRAXIS - autonomous Solana memecoin research and trading-research platform (research only, no live trading)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2",
    "structlog>=24.1,<26",
    "httpx>=0.27,<0.29",
    "websockets>=12.0,<16",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<8",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
]

[project.scripts]
vyraxis = "vyraxis.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vyraxis = ["storage/migrations/*.py", "storage/migrations/*.mako", "storage/migrations/versions/*.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL instance (VYRAXIS_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:vyraxis.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately take explicit timeouts and poll for a fixture's
# state; ASYNC109/ASYNC110 target production hot loops, not test scaffolding.
"tests/**" = ["S", "B008", "ASYNC109", "ASYNC110"]
# S105 flags any constant whose name contains TOKEN as a hardcoded password.
# These are public Solana program IDs and event-kind names - published,
# well-known addresses, not credentials.
"src/vyraxis/solana/programs.py" = ["S105"]
"src/vyraxis/core/enums.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vyraxis"]
mypy_path = "src"
plugins = []
disallow_untyped_decorators = false
