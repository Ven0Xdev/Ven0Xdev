[pytest]
# Backstop against a genuinely hung test (e.g. an unbounded network call or
# retry loop) — fails that one test loudly with a thread-dump traceback
# after 120s instead of blocking the whole suite indefinitely. 120s is
# generous relative to every test's actual runtime today (the slowest
# individual tests are a few seconds; the full suite's multi-minute
# duration is hundreds of fast tests, not one slow one) — this exists to
# catch a hang, not to constrain normal test speed.
timeout = 120
timeout_method = thread
